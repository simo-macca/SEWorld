plugins {
    id 'java'
    id 'org.springframework.boot' version '3.4.3'
    id 'io.spring.dependency-management' version '1.1.7'
    id 'jacoco'
    id 'com.diffplug.spotless' version '6.20.0'
}

java {
    sourceCompatibility = '21'
    targetCompatibility = '21'
}

spotless {
    java {
        googleJavaFormat()
        formatAnnotations()
    }
}

group = 'ch.usi.inf.bsc.sa4'
version = '0.0.1-SNAPSHOT'

repositories {
    mavenCentral()
}

ext {
    set('springAiVersion', "1.0.0-M6")
}

dependencies {
    // Use PostgreSQL instead of MongoDB
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa' // JPA dependency
    implementation 'org.postgresql:postgresql:42.7.5' // PostgreSQL driver

    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-security' // Security dependencies
    implementation 'org.springframework.boot:spring-boot-starter-oauth2-client'
    implementation 'org.springframework.boot:spring-boot-starter-oauth2-resource-server'

    implementation 'org.springframework.ai:spring-ai-ollama-spring-boot-starter'
    implementation 'org.springframework.boot:spring-boot-starter-validation' // Validation dependencies

    developmentOnly 'org.springframework.boot:spring-boot-devtools'
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.springframework.security:spring-security-test'
    testImplementation "io.zonky.test:embedded-postgres:2.0.7"
    testImplementation "io.zonky.test:embedded-database-spring-test:2.6.0"
    testImplementation 'org.mockito:mockito-core:3.12.4'
}

dependencyManagement {
    imports {
        mavenBom "org.springframework.ai:spring-ai-bom:${springAiVersion}"
    }
}

tasks.named('test') {
    useJUnitPlatform()
}


test {
    finalizedBy jacocoTestReport
}

jacocoTestReport {
    dependsOn test
    reports {
        xml.required = true
    }
}

javadoc {
    options.tags = ["spec.requires:cm:Requires:", "returns", "spec.effects:cm:Effects:", "spec.modifies:cm:Modifies:"]
}